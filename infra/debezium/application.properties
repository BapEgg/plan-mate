debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST}
debezium.sink.rabbitmq.connection.port=${RABBITMQ_PORT}
debezium.sink.rabbitmq.connection.username=${RABBITMQ_USERNAME}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_PASSWORD}
debezium.sink.rabbitmq.exchange=planmate.itinerary
debezium.sink.rabbitmq.routingKey=itinerary.generation.requested
debezium.sink.rabbitmq.routingKey.source=static
debezium.sink.rabbitmq.deliveryMode=2

quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.micrometer.export.prometheus.enabled=true

debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.database.hostname=${POSTGRES_HOST}
debezium.source.database.port=${POSTGRES_PORT}
debezium.source.database.user=${POSTGRES_USER}
debezium.source.database.password=${POSTGRES_PASSWORD}
debezium.source.database.dbname=${POSTGRES_DB}
debezium.source.topic.prefix=planmate
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=${DEBEZIUM_SLOT_NAME}
debezium.source.publication.name=${DEBEZIUM_PUBLICATION_NAME}
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.outbox_events
debezium.source.tombstones.on.delete=false

debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=aggregate_id
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.table.field.event.timestamp=created_at
debezium.transforms.outbox.route.by.field=event_type
debezium.transforms.outbox.route.topic.replacement=itinerary.generation.requested
debezium.transforms.outbox.table.fields.additional.placement=aggregate_type:header:aggregateType,event_type:header:eventType
debezium.transforms.outbox.table.expand.json.payload=true
debezium.transforms.outbox.route.tombstone.on.empty.payload=false
