name: planmate-local

services:
  postgres:
    image: postgres:17
    container_name: planmate-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planmate}
      POSTGRES_USER: ${POSTGRES_USER:-planmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmate}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - planmate-local

  redis:
    image: redis:8
    container_name: planmate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - planmate-local

  rabbitmq:
    image: rabbitmq:4-management
    container_name: planmate-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-planmate}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-planmate}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - planmate-local

  debezium:
    image: quay.io/debezium/server:3.5
    container_name: planmate-debezium
    restart: unless-stopped
    profiles:
      - cdc

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-planmate}
      POSTGRES_USER: ${POSTGRES_USER:-planmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmate}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-planmate}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-planmate}
      DEBEZIUM_SLOT_NAME: ${DEBEZIUM_SLOT_NAME:-planmate_outbox_slot}
      DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME:-planmate_outbox_publication}

    volumes:
      - ./debezium/application.properties:/debezium/conf/application.properties:ro
      - debezium-data:/debezium/data

    networks:
      - planmate-local

  nginx:
    image: nginx:stable-alpine
    container_name: planmate-nginx
    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-8088}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - planmate-local

volumes:
  postgres-data:
  redis-data:
  debezium-data:

networks:
  planmate-local:
    name: planmate-local
