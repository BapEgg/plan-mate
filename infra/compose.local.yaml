name: planmate-local

services:
  postgres:
    image: postgres:17
    container_name: planmate-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planmate}
      POSTGRES_USER: ${POSTGRES_USER:-planmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmate}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - planmate-local

  redis:
    image: redis:8
    container_name: planmate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - planmate-local

  rabbitmq:
    image: rabbitmq:4-management
    container_name: planmate-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-planmate}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-planmate}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"

    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - planmate-local

  debezium:
    image: quay.io/debezium/server:3.5
    container_name: planmate-debezium
    restart: unless-stopped
    profiles:
      - cdc

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-planmate}
      POSTGRES_USER: ${POSTGRES_USER:-planmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmate}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-planmate}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-planmate}
      DEBEZIUM_SLOT_NAME: ${DEBEZIUM_SLOT_NAME:-planmate_outbox_slot}
      DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME:-planmate_outbox_publication}
      JMX_EXPORTER_PORT: 9404

    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - debezium-data:/debezium/data

    ports:
      - "${DEBEZIUM_HTTP_PORT:-8083}:8080"
      - "${DEBEZIUM_METRICS_PORT:-9404}:9404"

    networks:
      - planmate-local

  prometheus:
    image: prom/prometheus:latest
    container_name: planmate-prometheus
    restart: unless-stopped
    profiles:
      - monitoring

    depends_on:
      rabbitmq:
        condition: service_healthy

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - planmate-local

  grafana:
    image: grafana/grafana:latest
    container_name: planmate-grafana
    restart: unless-stopped
    profiles:
      - monitoring

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-planmate}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-planmate}
      GF_USERS_DEFAULT_THEME: light

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - planmate-local

  nginx:
    image: nginx:stable-alpine
    container_name: planmate-nginx
    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-8088}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - planmate-local

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  debezium-data:
  grafana-data:

networks:
  planmate-local:
    name: planmate-local
