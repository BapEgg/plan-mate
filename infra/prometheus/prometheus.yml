global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: planmate-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: planmate-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: planmate-worker-recovery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: debezium
    static_configs:
      - targets:
          - debezium:9404

  - job_name: debezium-exp3-detect
    static_configs:
      - targets:
          - host.docker.internal:9705

  - job_name: debezium-exp3-replay
    static_configs:
      - targets:
          - host.docker.internal:9706

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
