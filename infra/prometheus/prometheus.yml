global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: planmate-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: debezium
    static_configs:
      - targets:
          - debezium:9404

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
