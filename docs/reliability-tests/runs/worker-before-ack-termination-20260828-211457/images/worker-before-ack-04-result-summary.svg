<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">PlanMate ACK 이전 Worker 강제 종료 장애 주입 테스트 결과</title>
  <desc id="desc">DB 반영 1건과 Unacked 1건을 확인한 뒤 Worker를 종료했다. Ready 10건 재큐잉, 재전달 1건, 중복 처리 차단 1건, READY 10건, 유실과 후보 중복 0건으로 PASS 판정</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .text { font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; fill: #0f172a; }
      .muted { fill: #64748b; }
      .label { font-size: 18px; font-weight: 700; }
      .value { font-size: 31px; font-weight: 800; }
      .metric-label { font-size: 15px; font-weight: 650; }
      .metric-value { font-size: 25px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="590" rx="28" fill="url(#background)"/>
  <text class="text" x="56" y="66" font-size="20" font-weight="700" fill="#4f46e5">RELIABILITY TEST 02 · 2026-08-28</text>
  <text class="text" x="56" y="112" font-size="34" font-weight="850">DB 반영 후 ACK 이전 Worker 강제 종료</text>
  <text class="text muted" x="56" y="145" font-size="17">ACK 전에 프로세스가 죽어도 재전달되고, 이미 저장한 결과는 중복 생성되지 않는가?</text>

  <rect x="1012" y="48" width="132" height="54" rx="27" fill="#dcfce7" stroke="#86efac"/>
  <circle cx="1043" cy="75" r="10" fill="#16a34a"/>
  <text class="text" x="1063" y="83" font-size="22" font-weight="850" fill="#166534">PASS</text>

  <g filter="url(#shadow)">
    <rect x="56" y="190" width="250" height="160" rx="20" fill="#ffffff" stroke="#fecaca"/>
    <rect x="335" y="190" width="250" height="160" rx="20" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="614" y="190" width="250" height="160" rx="20" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="893" y="190" width="251" height="160" rx="20" fill="#ffffff" stroke="#bbf7d0"/>
  </g>

  <circle cx="92" cy="226" r="18" fill="#fee2e2"/>
  <text class="text" x="86" y="233" font-size="18" font-weight="800" fill="#dc2626">1</text>
  <text class="text label" x="122" y="233">ACK 직전</text>
  <text class="text value" x="82" y="286">DB READY 1</text>
  <text class="text value" x="82" y="324">Unacked 1</text>

  <path d="M309 270H326" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 260L332 270L320 280" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="371" cy="226" r="18" fill="#ffedd5"/>
  <text class="text" x="365" y="233" font-size="18" font-weight="800" fill="#ea580c">2</text>
  <text class="text label" x="401" y="233">Worker 종료</text>
  <text class="text value" x="361" y="293">Ready 10</text>
  <text class="text muted" x="361" y="324" font-size="15">미확인 1 + 대기 9 재큐잉</text>

  <path d="M588 270H605" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M599 260L611 270L599 280" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="650" cy="226" r="18" fill="#ede9fe"/>
  <text class="text" x="644" y="233" font-size="18" font-weight="800" fill="#7c3aed">3</text>
  <text class="text label" x="680" y="233">재시작 처리</text>
  <text class="text value" x="640" y="286">Deliver 11</text>
  <text class="text" x="640" y="322" font-size="22" font-weight="800">재전달 1 · SKIP 1</text>

  <path d="M867 270H884" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M878 260L890 270L878 280" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="929" cy="226" r="18" fill="#dcfce7"/>
  <text class="text" x="923" y="233" font-size="18" font-weight="800" fill="#16a34a">4</text>
  <text class="text label" x="959" y="233">최종 상태</text>
  <text class="text value" x="919" y="293">READY 10/10</text>
  <text class="text muted" x="919" y="324" font-size="15">후보 1,200 · 중복 0</text>

  <g filter="url(#shadow)">
    <rect x="56" y="386" width="252" height="128" rx="18" fill="#ffffff"/>
    <rect x="332" y="386" width="252" height="128" rx="18" fill="#ffffff"/>
    <rect x="608" y="386" width="252" height="128" rx="18" fill="#ffffff"/>
    <rect x="884" y="386" width="260" height="128" rx="18" fill="#ffffff"/>
  </g>

  <text class="text muted metric-label" x="82" y="424">메시지 재큐잉</text>
  <text class="text metric-value" x="82" y="470">4.063초</text>
  <text class="text muted" x="82" y="495" font-size="14">Unacked 1 → Ready 10</text>

  <text class="text muted metric-label" x="358" y="424">Worker Health 복구</text>
  <text class="text metric-value" x="358" y="470">13.425초</text>
  <text class="text muted" x="358" y="495" font-size="14">재시작 → API UP</text>

  <text class="text muted metric-label" x="634" y="424">10건 READY 완료</text>
  <text class="text metric-value" x="634" y="470">17.617초</text>
  <text class="text muted" x="634" y="495" font-size="14">재시작 → Backlog 처리</text>

  <text class="text muted metric-label" x="910" y="424">유실 / 후보 중복 / DLQ 증가</text>
  <text class="text metric-value" x="910" y="470" fill="#16a34a">0 / 0 / 0건</text>
  <text class="text muted" x="910" y="495" font-size="14">정합성 검증 PASS</text>

  <text class="text muted" x="56" y="558" font-size="14">Run: worker-before-ack-termination-20260828-211457 · Local Docker Desktop · Prometheus/Grafana + DB + RabbitMQ API + Worker log 교차 검증</text>
</svg>
