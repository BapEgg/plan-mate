name: 인프라 작업
description: 인프라, 배포, CI/CD, 환경 설정 작업을 등록합니다.
title: "[infra] "
labels: ["infra"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예시: `[infra] GitHub Actions CI 구성`

        Issue 번호는 제목에 작성하지 않습니다. PR 본문에 `Closes #이슈번호`로 연결합니다.
  - type: textarea
    id: environment
    attributes:
      label: 대상 환경
      description: 변경 대상 환경을 작성해주세요.
      placeholder: "예: local, dev, staging, production, GitHub Actions"
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 작업 대상
      description: Docker, GitHub Actions, Nginx, 환경 변수 등 대상을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 변경 내용
      description: 필요한 설정 변경 내용을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: deploy-impact
    attributes:
      label: 배포 영향도
      description: 배포 과정, 서비스 중단 가능성, 기존 환경과의 호환성 영향을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: rollback-plan
    attributes:
      label: 롤백 계획
      description: 문제가 발생했을 때 이전 상태로 되돌리는 방법을 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 주의 사항
      description: 배포, 보안, 로컬 환경 영향이 있다면 작성해주세요.
