name: 문서 작업
description: 문서 추가, 수정, 보완 작업을 등록합니다.
title: "[docs] "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예시: `[docs] AI 작업 문서 구조 정리`

        Issue 번호는 제목에 작성하지 않습니다. PR 본문에 `Closes #이슈번호`로 연결합니다.
  - type: textarea
    id: location
    attributes:
      label: 문서 위치
      description: 변경할 문서 위치를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: 작업 내용
      description: 추가하거나 수정할 문서 내용을 작성해주세요.
    validations:
      required: true
