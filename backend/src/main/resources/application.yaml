spring:
  application:
    name: planmate-backend

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - account_email
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:local-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:local-naver-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - nickname
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  outbox:
    retention:
      enabled: ${APP_OUTBOX_RETENTION_ENABLED:true}
      retention: ${APP_OUTBOX_RETENTION:7d}
      cleanup-interval: ${APP_OUTBOX_CLEANUP_INTERVAL:1h}
      batch-size: ${APP_OUTBOX_CLEANUP_BATCH_SIZE:1000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:}
  oauth2:
    success-redirect-path: /main
    failure-redirect-path: /?oauth2Error=true
  profile-image:
    upload-dir: ${PROFILE_IMAGE_UPLOAD_DIR:uploads/profile-images}
    public-path: /uploads/profile-images
    max-size: 2097152
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      text-search-radius-meters: ${GOOGLE_PLACES_TEXT_SEARCH_RADIUS_METERS:30000}
    routes:
      api-key: ${GOOGLE_ROUTES_API_KEY:}
  itinerary:
    manual-handoff-enabled: ${APP_ITINERARY_MANUAL_HANDOFF_ENABLED:false}
    generation-worker:
      enabled: ${APP_ITINERARY_GENERATION_WORKER_ENABLED:true}
      max-attempts: ${APP_ITINERARY_GENERATION_WORKER_MAX_ATTEMPTS:3}
      processing-lease: ${APP_ITINERARY_GENERATION_WORKER_PROCESSING_LEASE:15m}
      stale-recovery-enabled: ${APP_ITINERARY_GENERATION_WORKER_STALE_RECOVERY_ENABLED:true}
      recovery-scan-interval: ${APP_ITINERARY_GENERATION_WORKER_RECOVERY_SCAN_INTERVAL:1m}
      recovery-batch-size: ${APP_ITINERARY_GENERATION_WORKER_RECOVERY_BATCH_SIZE:50}
      exchange: ${APP_ITINERARY_GENERATION_EXCHANGE:planmate.itinerary}
      queue: ${APP_ITINERARY_GENERATION_QUEUE:planmate.itinerary.generation.requested}
      routing-key: ${APP_ITINERARY_GENERATION_ROUTING_KEY:itinerary.generation.requested}
      dead-letter-exchange: ${APP_ITINERARY_GENERATION_DLX:planmate.itinerary.dlx}
      dead-letter-queue: ${APP_ITINERARY_GENERATION_DLQ:planmate.itinerary.generation.requested.dlq}
      dead-letter-routing-key: ${APP_ITINERARY_GENERATION_DLQ_ROUTING_KEY:itinerary.generation.requested.dlq}
    schedule:
      default-start-time: ${APP_ITINERARY_SCHEDULE_DEFAULT_START_TIME:08:00}
      default-end-time: ${APP_ITINERARY_SCHEDULE_DEFAULT_END_TIME:20:00}
    candidates:
      target-count: ${APP_ITINERARY_CANDIDATE_TARGET_COUNT:120}
      max-raw-count: ${APP_ITINERARY_CANDIDATE_MAX_RAW_COUNT:180}
      page-size: ${APP_ITINERARY_CANDIDATE_PAGE_SIZE:20}
      max-distance-meters: ${APP_ITINERARY_CANDIDATE_MAX_DISTANCE_METERS:50000}
  jwt:
    secret: ${JWT_SECRET:planmate-local-development-jwt-secret-key-must-be-at-least-32-bytes}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
